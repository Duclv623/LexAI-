spring:
  application:
    name: auth-service
  config:
    # Nạp file .env cạnh service (cùng cú pháp KEY=value nên đọc được như .properties).
    # optional: -> thiếu file thì bỏ qua, không làm app chết.
    # Biến môi trường thật của máy vẫn được ưu tiên cao hơn file này.
    import: optional:file:.env[.properties]
  data:
    redis:
      # Nơi lưu token hiện hành của từng tài khoản (key jwt:{accountId}).
      # Gateway đọc chính key này để biết token đã bị thu hồi hay chưa.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    # Database-per-service: auth-service chỉ có tài khoản vào chatbox_auth.
    # Postgres từ chối kết nối sang DB của service khác (xem docker/postgres-init).
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/chatbox_auth}
    username: ${AUTH_DB_USERNAME:auth_service}
    password: ${AUTH_DB_PASSWORD:auth_service}
  jpa:
    hibernate:
      ddl-auto: ${AUTH_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: ${AUTH_JPA_FORMAT_SQL:true}

server:
  port: ${AUTH_SERVER_PORT:8081}
  error:
    # Mặc định Spring giấu message lỗi, client chỉ nhận được mã trạng thái trống rỗng.
    # Frontend đang hiển thị j.message nên cần bật lên, ví dụ "Mật khẩu hiện tại không đúng".
    include-message: always

app:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8081}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:86400}
    # Private key RSA cố định (PKCS#8 DER -> base64 một dòng). Để trống = sinh khoá tạm mỗi lần chạy.
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
