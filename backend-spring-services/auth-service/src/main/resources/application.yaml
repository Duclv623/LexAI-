spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/chatbox
    username: chatbox
    password: chatbox
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

app:
  jwt:
    secret: change-this-dev-secret-change-this-dev-secret
    expiration-seconds: 86400
