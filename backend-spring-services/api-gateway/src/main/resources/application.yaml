spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: chat-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/chat/**
            - id: ai-service
              uri: http://localhost:8000
              predicates:
                - Path=/api/ai/**
              filters:
                - StripPrefix=2

server:
  port: 8080
