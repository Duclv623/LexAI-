spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: chat-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/chat/**
            - id: ai-service
              uri: http://localhost:8000
              predicates:
                - Path=/api/ai/**
              filters:
                - StripPrefix=2

server:
  port: 8080

app:
  rate-limit:
    rules:
      - name: auth
        path-prefix: /api/auth/
        limit: 10
        window-seconds: 60
      - name: chat
        path-prefix: /api/chat/
        limit: 20
        window-seconds: 60
      - name: ai
        path-prefix: /api/ai/
        limit: 10
        window-seconds: 60
