spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: chat-service
              uri: ${CHAT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/chat/**
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8000}
              predicates:
                - Path=/api/ai/**
              filters:
                - StripPrefix=2

server:
  port: ${GATEWAY_SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  cors:
    allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:3000}
  jwt:
    # Gateway verify token bằng public key lấy từ JWKS của auth-service.
    jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8081}
  rate-limit:
    rules:
      - name: auth-login
        path-prefix: /api/auth/login
        limit: 10
        window-seconds: 60
      - name: auth-register
        path-prefix: /api/auth/register
        limit: 5
        window-seconds: 60
      # Phần còn lại của auth frontend gọi mỗi lần load trang
      - name: auth
        path-prefix: /api/auth/
        limit: 60
        window-seconds: 60
      - name: chat
        path-prefix: /api/chat/
        limit: 20
        window-seconds: 60
      # Mỗi request là một lần gọi LLM
      - name: ai
        path-prefix: /api/ai/
        limit: 10
        window-seconds: 60
